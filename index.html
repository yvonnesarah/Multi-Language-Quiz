<!DOCTYPE html>
<html lang="en">

<head>
  <!-- ================= META CONFIGURATION ================= -->

  <!-- Character encoding -->
  <meta charset="UTF-8" />

  <!-- Responsive viewport settings -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Page title shown in browser tab -->
  <title>Multi-Language Quiz</title>

  <!-- ================= EXTERNAL STYLES ================= -->

  <!-- Bootstrap CSS framework -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- ================= EXTERNAL SCRIPTS ================= -->

  <!-- jQuery library -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Confetti animation library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

<!-- ================= MAIN APP CONTAINER ================= -->
<div class="container py-5">

  <!-- Glassmorphism card wrapper -->
  <div class="glass p-4 rounded-4 shadow-lg">

    <!-- ================= HEADER SECTION ================= -->
    <header class="text-center mb-4">

      <!-- Theme Toggle Button -->
      <div class="d-flex justify-content-between align-items-center mb-3">

        <!-- Empty div used for spacing -->
        <div></div>

        <!-- Dark/Light mode toggle -->
        <button id="themeToggle" class="btn btn-light btn-sm">
          🌙 Theme
        </button>
      </div>

      <!-- Application title -->
      <h1 class="fw-bold">🌍 Multi-Language Quiz</h1>

      <!-- Subtitle -->
      <p class="text-light opacity-75">
        Test your knowledge across categories
      </p>

    </header>

    <!-- ================= HOME PAGE ================= -->
    <section id="homePage">

      <!-- Welcome Text -->
      <div class="text-center mb-4">
        <h3>Welcome</h3>
        <p class="opacity-75">
          Set up your quiz and start playing
        </p>
      </div>

      <!-- Quiz Settings Container -->
      <div class="settings-box p-4 rounded-4">

        <!-- ================= PLAYER NAME ================= -->
        <div class="mb-3">

          <!-- Input label -->
          <label class="form-label">Player Name</label>

          <!-- Name input field -->
          <input 
            type="text" 
            id="playerName" 
            class="form-control" 
            placeholder="Enter your name"
          >
        </div>

        <!-- ================= CATEGORY SELECTION ================= -->
        <div class="mb-3">

          <!-- Category label -->
          <label class="form-label">Category</label>

          <!-- Category dropdown -->
          <select id="category" class="form-select">

            <!-- Trivia categories -->
            <option value="9">General Knowledge</option>
            <option value="10">Books</option>
            <option value="11">Film</option>
            <option value="12">Music</option>
            <option value="17">Science</option>
            <option value="18">Computers</option>
            <option value="21">Sports</option>
            <option value="22">Geography</option>
            <option value="23">History</option>

          </select>
        </div>

        <!-- ================= LANGUAGE SELECTION ================= -->
        <div class="mb-3">

          <!-- Language label -->
          <label for="language" class="form-label">
            Language
          </label>

          <!-- Language dropdown -->
          <select id="language" class="form-select">

            <!-- Supported languages -->
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>

          </select>
        </div>

        <!-- ================= DIFFICULTY LEVEL ================= -->
        <div class="mb-3">

          <!-- Difficulty label -->
          <label class="form-label">Difficulty</label>

          <!-- Difficulty dropdown -->
          <select id="difficulty" class="form-select">

            <!-- Difficulty options -->
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>

          </select>
        </div>

        <!-- ================= QUESTION COUNT ================= -->
        <div class="mb-4">

          <!-- Questions label -->
          <label class="form-label">Questions</label>

          <!-- Question count dropdown -->
          <select id="questionCount" class="form-select">

            <!-- Number of questions -->
            <option value="5">5 Questions</option>
            <option value="10">10 Questions</option>
            <option value="15">15 Questions</option>
            <option value="20">20 Questions</option>

          </select>
        </div>

        <!-- ================= START QUIZ BUTTON ================= -->
        <div class="d-grid">

          <!-- Start button -->
          <button id="startBtn" class="btn btn-warning btn-lg fw-bold">
            🚀 Start Quiz
          </button>

        </div>

        <!-- ================= VIEW LEADERBOARD BUTTON ================= -->
        <div class="d-grid mt-3">

          <!-- Leaderboard navigation button -->
          <button id="viewLeaderboardBtn" class="btn btn-outline-light">
            🏆 View Leaderboard
          </button>

        </div>

      </div>
    </section>

    <!-- ================= QUIZ PAGE ================= -->
    <section id="quizPage" class="d-none">

      <!-- ================= QUIZ HEADER ================= -->

      <!-- Progress text + countdown timer -->
      <div class="mb-3 d-flex justify-content-between">

        <!-- Current question progress -->
        <small id="progressText"></small>

        <!-- Timer display -->
        <small id="timerText">⏱️ 15s</small>

      </div>

      <!-- ================= PROGRESS BAR ================= -->

      <!-- Quiz completion progress -->
      <div class="progress mb-2">

        <!-- Filled progress bar -->
        <div id="progressBar" class="progress-bar"></div>

      </div>

      <!-- ================= TIMER BAR ================= -->

      <!-- Countdown animation bar -->
      <div class="timer-bar mb-3">

        <!-- Timer fill element -->
        <div id="timerBarFill"></div>

      </div>

      <!-- ================= QUIZ CONTROLS ================= -->
      <div class="d-flex justify-content-between mb-3">

        <!-- Previous question button -->
        <button id="prevBtn" class="btn btn-outline-light btn-sm">
          ⬅ Previous
        </button>

        <!-- Pause timer button -->
        <button id="pauseBtn" class="btn btn-warning">
          ⏸ Pause
        </button>

        <!-- 50/50 lifeline button -->
        <button id="fiftyBtn" class="btn btn-outline-warning btn-sm">
          50/50
        </button>

        <!-- Next question button -->
        <button id="nextBtn" class="btn btn-outline-light btn-sm">
          Next ➡
        </button>

      </div>

      <!-- ================= LOADING SPINNER ================= -->

      <!-- Loader displayed while questions are fetched -->
      <div id="loader" class="text-center d-none">

        <!-- Bootstrap spinner -->
        <div class="spinner-border text-warning"></div>

        <!-- Loading message -->
        <p class="mt-2">Loading questions...</p>

      </div>

      <!-- ================= QUIZ CONTENT ================= -->

      <!-- Questions and answers rendered here dynamically -->
      <div id="quizBox"></div>

      <!-- Live score display -->
      <div id="scoreBox" class="text-center fw-bold mt-3"></div>

    </section>

    <!-- ================= RESULTS PAGE ================= -->
    <section id="resultsPage" class="d-none text-center">

      <!-- Completion heading -->
      <h2 class="fw-bold mb-3">
        🎉 Quiz Completed
      </h2>

      <!-- Results summary container -->
      <div class="results-box p-4 rounded-4 mb-3">

        <!-- Final score -->
        <div id="finalScore"></div>

        <!-- Statistics section -->
        <div id="statsBox" class="mt-4"></div>

      </div>

      <!-- ================= ANSWER REVIEW SECTION ================= -->

      <!-- Displays correct/incorrect answers -->
      <div id="reviewAnswers" class="text-start mb-4"></div>

      <!-- ================= RESULT ACTION BUTTONS ================= -->
      <div class="d-flex justify-content-center gap-2">

        <!-- Restart quiz -->
        <button id="restartBtn" class="btn btn-success">
          🔁 Play Again
        </button>

        <!-- Open leaderboard -->
        <button id="leaderboardBtn" class="btn btn-warning">
          🏆 Leaderboard
        </button>

        <!-- Return to homepage -->
        <button id="homeBtn" class="btn btn-light">
          🏠 Back to Home
        </button>

      </div>

    </section>

    <!-- ================= LEADERBOARD PAGE ================= -->
    <section id="leaderboardPage" class="d-none text-center">

      <!-- Leaderboard heading -->
      <h2 class="fw-bold mb-4">
        🏆 Leaderboard
      </h2>

      <!-- Leaderboard display container -->
      <div class="results-box p-4 rounded-4 mb-4">

        <!-- Dynamic leaderboard content -->
        <div id="leaderboard"></div>

      </div>

      <!-- ================= LEADERBOARD NAVIGATION ================= -->
      <div class="d-flex justify-content-center gap-2">

        <!-- Return to home -->
        <button id="leaderboardHomeBtn" class="btn btn-light">
          🏠 Back to Home
        </button>

      </div>

    </section>

  </div>
</div>

<!-- ================= TOAST MESSAGE ================= -->

<!-- Toast notification container -->
<div id="toast" class="toast-message"></div>

<!-- ================= MAIN JAVASCRIPT ================= -->

<!-- Main application script -->
<script src="assets/js/script.js"></script>

</body>
</html>
