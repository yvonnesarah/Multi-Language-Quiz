<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi-Language Quiz</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<div class="container py-4">

  <div class="glass">

    <h2 class="text-center mb-4">🌍 Multi-Language Quiz</h2>

    <!-- Controls -->
    <div class="row g-2 mb-3">

    <div class="col-md-4">
  <select id="category" class="form-select">

    <option value="9">🧠 General Knowledge</option>
    <option value="10">📚 Books</option>
    <option value="11">🎬 Film</option>
    <option value="12">🎵 Music</option>
    <option value="17">🧪 Science & Nature</option>
    <option value="18">💻 Computers</option>
    <option value="21">🏆 Sports</option>
    <option value="22">🌍 Geography</option>
    <option value="23">📜 History</option>

  </select>
</div>

      <div class="col-md-3">
        <select id="difficulty" class="form-select">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div class="col-md-3">
        <select id="language" class="form-select">
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="hi">Hindi</option>
          <option value="ar">Arabic</option>
          <option value="zh">Chinese</option>
        </select>
      </div>

      <div class="col-md-2 d-grid">
        <button id="generateBtn" class="btn btn-warning fw-bold">
          Generate
        </button>
      </div>

    </div>

    <!-- Loader -->
    <div id="loader" class="text-center my-3 d-none">
      <div class="spinner-border text-light"></div>
      <p class="mt-2">Loading quiz questions...</p>
    </div>

    <!-- Quiz -->
    <div id="quizBox"></div>

    <!-- Score -->
    <div id="scoreBox" class="text-center fw-bold mt-3"></div>

  </div>
</div>

<!-- JS -->
<script src="assets/js/script.js"></script>

</body>
</html>
