<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi-Language Quiz</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<div class="container py-5">
  <div class="glass p-4 rounded-4 shadow-lg">

    <!-- ================= HEADER ================= -->
    <header class="text-center mb-4">
      <h1 class="fw-bold">🌍 Multi-Language Quiz</h1>
      <p class="text-light opacity-75 mb-0">
        Test your knowledge across categories and languages
      </p>
    </header>

    <!-- ================= HOME PAGE ================= -->
    <section id="homePage">

      <div class="text-center mb-4">
        <h3 class="fw-semibold">Welcome 👋</h3>
        <p class="text-light opacity-75">
          Configure your quiz and start playing instantly
        </p>
      </div>

      <!-- SETTINGS CARD -->
      <div class="p-4 rounded-4 mb-3" style="background: rgba(255,255,255,0.06);">

        <div class="row g-3">

          <!-- CATEGORY -->
          <div class="col-md-4">
            <label class="form-label text-light">Category</label>
            <select id="category" class="form-select">
              <option value="9">🧠 General Knowledge</option>
              <option value="10">📚 Books</option>
              <option value="11">🎬 Film</option>
              <option value="12">🎵 Music</option>
              <option value="17">🧪 Science & Nature</option>
              <option value="18">💻 Computers</option>
              <option value="21">🏆 Sports</option>
              <option value="22">🌍 Geography</option>
              <option value="23">📜 History</option>
            </select>
          </div>

          <!-- DIFFICULTY -->
          <div class="col-md-4">
            <label class="form-label text-light">Difficulty</label>
            <select id="difficulty" class="form-select">
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>

          <!-- LANGUAGE -->
          <div class="col-md-4">
            <label class="form-label text-light">Language</label>
            <select id="language" class="form-select">
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="hi">Hindi</option>
              <option value="ar">Arabic</option>
              <option value="zh">Chinese</option>
            </select>
          </div>

        </div>

        <!-- START BUTTON -->
        <div class="d-grid mt-4">
          <button id="startBtn" class="btn btn-warning btn-lg fw-bold">
            🚀 Start Quiz
          </button>
        </div>

      </div>
    </section>

    <!-- ================= QUIZ PAGE ================= -->
    <section id="quizPage" class="d-none">

      <!-- PROGRESS -->
      <div class="mb-3">
        <div class="d-flex justify-content-between">
          <small id="progressText">Progress</small>
          <small id="timerText">⏱️ 15s</small>
        </div>
        <div class="progress">
          <div id="progressBar" class="progress-bar" style="width:0%"></div>
        </div>
      </div>

      <!-- NAV -->
      <div class="d-flex justify-content-between mb-3">
        <button id="prevBtn" class="btn btn-outline-light btn-sm">⬅ Previous</button>
        <button id="nextBtn" class="btn btn-outline-light btn-sm">Next ➡</button>
      </div>

      <!-- LOADER -->
      <div id="loader" class="text-center my-3 d-none">
        <div class="spinner-border text-warning"></div>
        <p class="mt-2">Loading questions...</p>
      </div>

      <!-- QUIZ CONTENT -->
      <div id="quizBox"></div>

      <div id="scoreBox" class="text-center fw-bold mt-3"></div>

    </section>

    <!-- ================= RESULTS PAGE ================= -->
    <section id="resultsPage" class="d-none text-center py-4">

      <h2 class="fw-bold mb-3">🎉 Quiz Completed</h2>

      <div class="p-3 rounded-4 mb-3" style="background: rgba(255,255,255,0.06);">
        <p id="finalScore" class="mb-2"></p>
        <p id="bestScore" class="mb-0"></p>
      </div>

      <div class="d-flex justify-content-center gap-2">
        <button id="restartBtn" class="btn btn-success">
          🔁 Play Again
        </button>
        <button id="homeBtn" class="btn btn-light">
          🏠 Back to Home
        </button>
      </div>

    </section>

  </div>
</div>

<script src="assets/js/script.js"></script>

</body>
</html>
